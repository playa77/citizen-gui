<style>

.odl-home-listing .odl-status { display: inline-flex; align-items: center; gap: var(--ds-space-inline-sm); inline-size: fit-content; max-inline-size: 100%; min-block-size: var(--ds-size-control-sm);
  padding: 0 var(--ds-space-inset-sm); border-radius: var(--ds-radius-full); background: var(--ds-color-surface-raised); color: var(--ds-color-text-secondary);
  font: var(--ds-text-label-md); font-weight: var(--ds-font-weight-label); }
.odl-home-listing .odl-status::before { content: ""; flex: none; inline-size: var(--ds-space-6); block-size: var(--ds-space-6); border-radius: var(--ds-radius-full); background: currentColor; }
.odl-home-listing .odl-status[data-tone="neutral"] { color: var(--ds-color-text-secondary); }
.odl-home-listing .odl-status[data-tone="success"] { color: var(--ds-color-text-success); }
.odl-home-listing .odl-status[data-tone="warning"] { color: var(--ds-color-text-warning); }
.odl-home-listing .odl-status[data-tone="danger"] { color: var(--ds-color-text-danger); }
.odl-home-listing [data-od-item][hidden] { display: none; }
.odl-home-listing .odl-sr { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .odl-home-listing, .odl-home-listing *, .odl-home-listing *::before { transition: none !important; animation: none !important; } }
</style>

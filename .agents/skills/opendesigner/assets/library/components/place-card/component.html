<style>
.odl-place-card { box-sizing: border-box; inline-size: 100%; max-inline-size: 48rem; margin-inline: auto; container-type: inline-size; color: var(--ds-color-text-primary); font: var(--ds-text-body-md); text-wrap: pretty; }
.odl-place-card *, .odl-place-card *::before, .odl-place-card *::after { box-sizing: border-box; }

.odl-place-card .odl-ph::after { content: none; }
.odl-place-card .odl-body { display: grid; align-content: start; gap: var(--ds-space-stack-sm); padding: var(--ds-space-inset-lg); min-inline-size: 0; }

.odl-place-card h3 { margin: 0; font: var(--ds-text-title-md); overflow-wrap: anywhere; }
.odl-place-card .odl-fit { display: grid; gap: var(--ds-space-stack-xs); margin: 0; padding: var(--ds-space-inset-md); border-radius: var(--ds-radius-nested); background: var(--ds-color-surface-sunken); }
.odl-place-card .odl-fit dt { color: var(--ds-color-text-secondary); font: var(--ds-text-label-md); }
.odl-place-card .odl-fit dd { margin: 0; font: var(--ds-text-body-md); }

.odl-place-card .odl-where svg { flex: none; inline-size: var(--ds-size-icon-sm); block-size: var(--ds-size-icon-sm); margin-block-start: var(--ds-space-2); stroke-width: var(--ds-icon-stroke-md); }

  background: var(--ds-color-surface-raised); color: var(--ds-color-text-primary); font: var(--ds-text-label-lg); font-weight: var(--ds-font-weight-label); cursor: pointer;
  transition: background-color var(--ds-motion-duration-short) var(--ds-motion-easing-standard); }
.odl-place-card .odl-acts button:hover { background: var(--ds-color-bg-neutral-subtle); }

/* a wide container: the photo beside the words */
@container (min-width: 34rem) {

/* meta items stay whole; the dot before each item sits in the space between items, and a dot that would start a line is

.odl-place-card .odl-meta-in > span::before { content: "·"; position: absolute; inset-inline-start: 0; inline-size: var(--ds-space-inline-md); text-align: center; color: var(--ds-color-text-tertiary); }
.odl-place-card .odl-why { margin: 0; font: var(--ds-text-body-sm); }
.odl-place-card .odl-ph { position: relative; inline-size: 100%; overflow: hidden; background: var(--ds-color-surface-sunken); }
.odl-place-card .odl-ph::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 var(--ds-border-width-default) var(--ds-color-border-subtle); pointer-events: none; }
.odl-place-card .odl-ph .odl-img { position: absolute; inset: 0; display: block; inline-size: 100%; block-size: 100%; aspect-ratio: auto; object-fit: cover; }
.odl-place-card .odl-status { display: inline-flex; align-items: center; gap: var(--ds-space-inline-sm); inline-size: fit-content; max-inline-size: 100%; min-block-size: var(--ds-size-control-sm);
  padding: 0 var(--ds-space-inset-sm); border-radius: var(--ds-radius-full); background: var(--ds-color-surface-raised); color: var(--ds-color-text-secondary);
  font: var(--ds-text-label-md); font-weight: var(--ds-font-weight-label); }
.odl-place-card .odl-status::before { content: ""; flex: none; inline-size: var(--ds-space-6); block-size: var(--ds-space-6); border-radius: var(--ds-radius-full); background: currentColor; }
.odl-place-card .odl-status[data-tone="neutral"] { color: var(--ds-color-text-secondary); }
.odl-place-card .odl-status[data-tone="success"] { color: var(--ds-color-text-success); }
.odl-place-card .odl-status[data-tone="warning"] { color: var(--ds-color-text-warning); }
.odl-place-card .odl-status[data-tone="danger"] { color: var(--ds-color-text-danger); }
.odl-place-card [data-od-item][hidden] { display: none; }
.odl-place-card .odl-sr { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.odl-place-card .odl-body > .odl-status { padding-inline: 0; background: transparent; }
@media (prefers-reduced-motion: reduce) { .odl-place-card, .odl-place-card *, .odl-place-card *::before { transition: none !important; animation: none !important; } }
</style>
